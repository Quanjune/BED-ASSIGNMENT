<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hawkers | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <div class="container">
    <div class="auth-shell">
      <section class="card">
        <div class="brand-row">
          <div class="brand-mark">
            <img src="/media/icons/hawker_icon.svg" alt="Hawkers logo" width="30" height="30">
          </div>
          <h1 class="brand-name">Hawkers</h1>
        </div>

        <h2 class="form-title">Welcome Back!</h2>
        <p class="brand-subtitle">Sign in to your account.</p>

        <form class="form" id="loginForm">
          <label for="email">Email Address</label>
          <input id="email" class="input" type="email" placeholder="Enter your email address" autocomplete="email" required>

          <label for="password">Password</label>
          <input id="password" class="input" type="password" placeholder="Enter your password" autocomplete="current-password" required>

          <p id="errorBox" style="color:#b23a43; font-size:12px; margin:4px 0 0; min-height:14px;"></p>

          <button id="btnLogin" class="btn" type="submit">Sign In</button>

          <a href="index.html" class="btn" style="background:#fff; border:1px solid var(--brand); color:var(--brand); box-shadow:none; text-decoration:none; text-align:center; display:block; margin-top:6px;">Continue as guest</a>

          <div class="links">
            <div>Don't have an account? <a href="signup.html">Sign Up</a></div>
          </div>
        </form>
      </section>

      <section class="photo-grid" aria-label="Photo collage">
        <div class="photo tall"><img src="/media/images/city.jpg" alt="Street scene"></div>
        <div class="photo-stack">
          <div class="photo"><img src="/media/images/hawker.jpg" alt="Hawker stall interior"></div>
          <div class="photo wide"><img src="/media/images/sg.jpg" alt="Singapore skyline"></div>
        </div>
      </section>
    </div>
  </div>

  <script src="scripts/auth.js"></script>
</body>
</html>
